<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f5132" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Rounded Rect -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#greenGrad)" filter="url(#shadow)"/>
  
  <!-- Clipboard Body -->
  <rect x="116" y="128" width="280" height="300" rx="24" fill="#ffffff"/>
  
  <!-- Clipboard Top Clip -->
  <rect x="186" y="96" width="140" height="56" rx="16" fill="#0f5132"/>
  <rect x="216" y="116" width="80" height="20" rx="10" fill="#ffffff"/>
  
  <!-- Checklist Lines -->
  <rect x="160" y="200" width="120" height="18" rx="9" fill="#e2e8f0"/>
  <rect x="160" y="240" width="100" height="18" rx="9" fill="#e2e8f0"/>
  
  <!-- Attendance Badge / Clock & Check -->
  <circle cx="330" cy="270" r="64" fill="#15803d"/>
  <circle cx="330" cy="270" r="54" fill="#ffffff"/>
  
  <!-- Clock hands -->
  <line x1="330" y1="270" x2="330" y2="236" stroke="#15803d" stroke-width="8" stroke-linecap="round"/>
  <line x1="330" y1="270" x2="352" y2="270" stroke="#15803d" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Big Green Checkmark on Bottom Right -->
  <circle cx="356" cy="360" r="42" fill="#16a34a"/>
  <path d="M336 360 L350 374 L378 344" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
